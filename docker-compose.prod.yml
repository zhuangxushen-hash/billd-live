# ========================================
# 直播系统 Docker Compose 配置
# 生产环境部署配置
# ========================================

version: '3.8'

# 生产环境配置
x-production-config: &production-config
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "3"

services:
  # ========================================
  # SRS 流媒体服务器
  # ========================================
  live-srs:
    image: ossrs/srs:5
    container_name: live-srs
    <<: *production-config
    ports:
      - "1935:1935"   # RTMP 推流端口
      - "19350:19350" # HTTPS 端口
    volumes:
      - ./deploy/srs/conf.srs:/usr/local/srs/conf/srs.conf:ro
      - ./data/srs/log:/usr/local/srs/log
      - ./data/srs/objs:/usr/local/srs/objs
      - ./deploy/ssl:/usr/local/srs/conf:ro
    environment:
      - SRS_HOST=${SRS_HOST:-live-srs}
    networks:
      - live-network
    healthcheck:
      test: ["CMD", "/usr/local/srs/bin/srs", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ========================================
  # 后端服务
  # ========================================
  live-server:
    build:
      context: ./live-server
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: live-server
    <<: *production-config
    env_file:
      - ./live-server/.env.production
    ports:
      - "3000:3000"
    volumes:
      - ./data/server:/app/data
      - ./data/videos:/app/videos
      - ./data/uploads:/app/uploads
      - ./data/popups:/app/popups
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
      - SRS_HOST=${SRS_HOST:-live-srs}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      live-srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - live-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

  # ========================================
  # 前端客户端（H5）
  # ========================================
  live-client:
    build:
      context: ./live-client
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_API_BASE_URL=https://${SERVER_DOMAIN}
        - VITE_SRS_URL=https://${SERVER_DOMAIN}
    container_name: live-client
    <<: *production-config
    depends_on:
      - live-server
    networks:
      - live-network

  # ========================================
  # 管理后台
  # ========================================
  live-admin:
    build:
      context: ./live-admin
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_API_BASE_URL=https://${ADMIN_DOMAIN}
    container_name: live-admin
    <<: *production-config
    depends_on:
      - live-server
    networks:
      - live-network

  # ========================================
  # Nginx 网关（SSL + 反向代理）
  # ========================================
  live-gateway:
    image: nginx:alpine
    container_name: live-gateway
    <<: *production-config
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # HTTP-FLV/HLS 流媒体代理
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/cache:/var/cache/nginx
      - ./deploy/nginx/logs:/var/log/nginx
    depends_on:
      live-client:
        condition: service_started
      live-admin:
        condition: service_started
      live-srs:
        condition: service_healthy
    networks:
      - live-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ========================================
  # 数据库备份服务（定时备份）
  # ========================================
  live-backup:
    image: alpine:latest
    container_name: live-backup
    <<: *production-config
    volumes:
      - ./data/server:/app/data:ro
      - ./backups:/backups
    environment:
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    entrypoint: >
      sh -c '
        while true; do
          echo "[$(date)] 开始备份..."
          tar czf /backups/backup_$(date +%Y%m%d_%H%M%S).tar.gz -C /app data/
          find /backups -name "backup_*.tar.gz" -mtime +${BACKUP_RETENTION_DAYS:-30} -delete
          echo "[$(date)] 备份完成，保留最近 ${BACKUP_RETENTION_DAYS:-30} 天"
          sleep 86400
        done
      '
    networks:
      - live-network

# ========================================
# 网络配置
# ========================================
networks:
  live-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ========================================
# 卷配置（使用本地挂载方便备份）
# ========================================
volumes:
  # 使用 bind mount，数据直接存储在宿主机
  # 这样方便备份和迁移
  default:
    driver: local