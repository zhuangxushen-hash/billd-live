# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name zhibo.gdwkls.com admin.zhibo.gdwkls.com;
    
    # 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# HTTP 直播流代理（用于FLV/HLS低延迟播放）
server {
    listen 8080;
    server_name _;
    
    # 反向代理到SRS流媒体服务器
    location /live/ {
        proxy_pass http://live-srs:8080/live/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 流媒体相关配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        
        # CORS 配置
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Range';
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    
    # HLS 流代理
    location /hls/ {
        proxy_pass http://live-srs:8080/live/;
        proxy_set_header Host $host;
        
        # HLS 相关配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # CORS 配置
        add_header Access-Control-Allow-Origin *;
    }
}

# 主站 HTTPS 配置
server {
    listen 443 ssl http2;
    server_name zhibo.gdwkls.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/zhibo.gdwkls.com.pem;
    ssl_certificate_key /etc/nginx/ssl/zhibo.gdwkls.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 反向代理到客户端容器
    location / {
        proxy_pass http://live-client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 直播流 HTTPS 代理
    location /live/ {
        proxy_pass http://live-srs:8080/live/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 流媒体相关配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # CORS 配置
        add_header Access-Control-Allow-Origin *;
    }
}

# 管理后台 HTTPS 配置
server {
    listen 443 ssl http2;
    server_name admin.zhibo.gdwkls.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/zhibo.gdwkls.com.pem;
    ssl_certificate_key /etc/nginx/ssl/zhibo.gdwkls.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 反向代理到管理后台容器
    location / {
        proxy_pass http://live-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}