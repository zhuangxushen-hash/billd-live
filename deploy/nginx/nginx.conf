# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name zhibo.gdwkls.com admin.zhibo.gdwkls.com;
    
    # 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# 主站 HTTPS 配置
server {
    listen 443 ssl http2;
    server_name zhibo.gdwkls.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/zhibo.gdwkls.com.pem;
    ssl_certificate_key /etc/nginx/ssl/zhibo.gdwkls.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 反向代理到客户端容器
    location / {
        proxy_pass http://live-client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 管理后台 HTTPS 配置
server {
    listen 443 ssl http2;
