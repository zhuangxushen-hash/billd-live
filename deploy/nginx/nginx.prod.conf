# ========================================
# 直播系统 Nginx 生产环境配置
# 高性能、安全、稳定
# ========================================

# 全局配置
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---------- 基础配置 ----------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ---------- 性能优化 ----------
    # 开启高效文件传输
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 连接超时
    keepalive_timeout 65;
    keepalive_requests 100;

    # 客户端请求超时
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 3600s;

    # 缓冲区设置
    client_body_buffer_size 256k;
    client_max_body_size 500m;  # 支持大文件上传（视频）
    large_client_header_buffers 4 32k;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # 不压缩图片和视频（已压缩的资源）
    gzip_disable "msie6";

    # ---------- 缓存配置 ----------
    # 代理缓存路径
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:100m max_size=1g inactive=60m;
    proxy_cache_key "$scheme$request_method$request_uri";

    # ---------- 速率限制 ----------
    # API 接口限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    # 连接数限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---------- 安全配置 ----------
    # 服务器_tokens
    server_tokens off;

    # 隐藏版本号
    more_clear_headers 'Server';

    # ---------- 虚拟主机配置 ----------

    # ========== HTTP 强制跳转 HTTPS ==========
    server {
        listen 80;
        server_name ${SERVER_DOMAIN} ${ADMIN_DOMAIN};

        # Let's Encrypt 验证路径
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========== 直播流 HTTP 代理（低延迟） ==========
    server {
        listen 8080;
        server_name _;

        # HTTP-FLV 直播流代理
        location /live/ {
            # 反向代理到 SRS
            proxy_pass http://live-srs:8080/live/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流媒体关键配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
            proxy_redirect off;

            # CORS 配置
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Range, Content-Type' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

            # 处理预检请求
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
                add_header Access-Control-Allow-Headers 'Origin, Range, Content-Type';
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            # 速率限制（直播流宽松一些）
            limit_req zone=api_limit burst=50 nodelay;
        }

        # HLS 流代理
        location /hls/ {
            proxy_pass http://live-srs:8080/live/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # HLS 缓存配置（HLS 可以缓存）
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
            proxy_read_timeout 60s;

            # CORS 配置
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=10" always;
        }

        # 禁止访问敏感路径
        location ~ /\.(git|env|svn|htaccess) {
            deny all;
        }
    }

    # ========== 主站 HTTPS 配置（客户端） ==========
    server {
        listen 443 ssl http2;
        server_name ${SERVER_DOMAIN};

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/${SERVER_DOMAIN}.pem;
        ssl_certificate_key /etc/nginx/ssl/${SERVER_DOMAIN}.key;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # SSL 协议配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL Session 配置
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ---------- 安全头 ----------
        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # 内容安全策略（CSP）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' https: http:; frame-ancestors 'none'; max-age=3600" always;

        # X-Content-Type-Options
        add_header X-Content-Type-Options nosniff always;

        # X-Frame-Options
        add_header X-Frame-Options DENY always;

        # X-XSS-Protection
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer-Policy
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Permissions-Policy
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---------- 反向代理配置 ----------

        # 直播流 HTTPS 代理
        location /live/ {
            proxy_pass http://live-srs:8080/live/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流媒体配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;

            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        }

        # API 接口代理
        location /api/ {
            proxy_pass http://live-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时配置
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            # 速率限制
            limit_req zone=api_limit burst=30 nodelay;
        }

        # WebSocket（弹幕等实时通信）
        location /ws/ {
            proxy_pass http://live-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket 长连接配置
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 75s;
        }

        # 静态资源缓存
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|webm|mp4)$ {
            proxy_pass http://live-client:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # 缓存配置
            proxy_cache static_cache;
            proxy_cache_valid 200 302 60m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # 添加缓存状态头（调试用）
            add_header X-Cache-Status $upstream_cache_status always;

            # 静态资源缓存头
            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }

        # 主站代理（客户端）
        location / {
            proxy_pass http://live-client:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 SPA 路由
            try_files $uri $uri/ /index.html;

            # 速率限制
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
        }

        # 禁止访问敏感路径
        location ~ /\.(git|env|svn|htaccess|idea|vscode) {
            deny all;
            return 404;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

    # ========== 管理后台 HTTPS 配置 ==========
    server {
        listen 443 ssl http2;
        server_name ${ADMIN_DOMAIN};

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/${ADMIN_DOMAIN}.pem;
        ssl_certificate_key /etc/nginx/ssl/${ADMIN_DOMAIN}.key;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # SSL 协议配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL Session 配置
        ssl_session_cache shared:ADMIN_SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------- 安全头 ----------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; frame-ancestors 'none'; max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---------- 管理后台特殊限制 ----------
        # 管理后台只允许内网访问（可选，根据需要调整）
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        # 登录接口限流（防止暴力破解）
        location /api/login {
            proxy_pass http://live-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 严格限流：登录接口每分钟只允许 5 次
            limit_req zone=login_limit burst=3 nodelay;
            limit_conn conn_limit 5;
        }

        # API 接口代理
        location /api/ {
            proxy_pass http://live-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时配置
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # 速率限制
            limit_req zone=api_limit burst=20 nodelay;
        }

        # WebSocket（弹幕等）
        location /ws/ {
            proxy_pass http://live-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 静态资源缓存
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://live-admin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            proxy_cache static_cache;
            proxy_cache_valid 200 302 60m;

            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }

        # 管理后台主站
        location / {
            proxy_pass http://live-admin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            try_files $uri $uri/ /index.html;

            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 5;
        }

        # 禁止访问敏感路径
        location ~ /\.(git|env|svn|htaccess|idea|vscode) {
            deny all;
            return 404;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}