version: '3.8'

services:
  # SRS 流媒体服务器
  live-srs:
    image: ossrs/srs:5
    container_name: live-srs
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP 推流端口
      - "8080:8080"   # HTTP-FLV/HLS 拉流端口
      - "19350:19350" # HTTPS 端口
    volumes:
      - ./deploy/srs/conf.srs:/usr/local/srs/conf/srs.conf:ro
      - srs-logs:/usr/local/srs/log
      - srs-record:/usr/local/srs/objs
    environment:
      - SRS_HOST=live-srs
    networks:
      - live-network
    healthcheck:
      test: ["CMD", "/usr/local/srs/bin/srs", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 后端服务
  live-server:
    build:
      context: ./live-server
      dockerfile: Dockerfile
    container_name: live-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - live-data:/app/data
      - live-videos:/app/videos
      - live-uploads:/app/uploads
      - live-config:/app/config
    environment:
      - SRS_HOST=live-srs
    depends_on:
      live-srs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - live-network

  # 前端客户端
  live-client:
    build:
      context: ./live-client
      dockerfile: Dockerfile
    container_name: live-client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - live-server
    networks:
      - live-network

  # 管理后台
  live-admin:
    build:
      context: ./live-admin
      dockerfile: Dockerfile
    container_name: live-admin
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - live-server
    networks:
      - live-network

  # 主 Nginx（SSL 终结 + 流媒体反向代理）
  live-gateway:
    image: nginx:alpine
    container_name: live-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # HTTP-FLV/HLS 流媒体代理
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - live-client
      - live-admin
      - live-srs
    networks:
      - live-network

volumes:
  live-data:
    driver: local
  live-videos:
    driver: local
  live-uploads:
    driver: local
  live-config:
    driver: local
  srs-logs:
    driver: local
  srs-record:
    driver: local

networks:
  live-network:
    driver: bridge